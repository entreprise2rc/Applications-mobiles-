<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Tâches" />
  <title>Mes Tâches</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-top">
      <div>
        <h1>Mes Tâches</h1>
        <p class="today" id="today-label"></p>
      </div>
      <button class="icon-btn" id="theme-toggle" aria-label="Changer de thème" title="Changer de thème">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>

    <section class="stats" aria-label="Progression">
      <div class="progress-ring" id="progress-ring" style="--p:0">
        <span id="progress-percent">0%</span>
      </div>
      <dl class="stat-list">
        <div><dt>À faire</dt><dd id="stat-active">0</dd></div>
        <div><dt>Terminées</dt><dd id="stat-done">0</dd></div>
        <div><dt>En retard</dt><dd id="stat-overdue" class="danger">0</dd></div>
      </dl>
    </section>

    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="search" placeholder="Rechercher une tâche…" aria-label="Rechercher" />
    </div>

    <nav class="filters" role="tablist" aria-label="Filtres">
      <button role="tab" data-filter="toutes" aria-selected="true">Toutes</button>
      <button role="tab" data-filter="actives" aria-selected="false">À faire</button>
      <button role="tab" data-filter="aujourdhui" aria-selected="false">Aujourd'hui</button>
      <button role="tab" data-filter="terminees" aria-selected="false">Terminées</button>
    </nav>

    <div class="toolbar">
      <select id="category-filter" aria-label="Filtrer par catégorie">
        <option value="">Toutes les catégories</option>
      </select>
      <select id="sort" aria-label="Trier">
        <option value="echeance">Tri : échéance</option>
        <option value="priorite">Tri : priorité</option>
        <option value="recentes">Tri : plus récentes</option>
      </select>
    </div>
  </header>

  <main>
    <ul class="task-list" id="task-list" aria-live="polite"></ul>
    <div class="empty" id="empty-state" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>
      <p id="empty-text">Aucune tâche pour le moment.</p>
    </div>
    <button class="link-btn" id="clear-completed" hidden>Supprimer les tâches terminées</button>
  </main>

  <button class="fab" id="add-btn" aria-label="Ajouter une tâche">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <dialog id="task-dialog" class="sheet">
    <form method="dialog" id="task-form">
      <div class="sheet-handle" aria-hidden="true"></div>
      <h2 id="dialog-title">Nouvelle tâche</h2>

      <label>Titre
        <input name="title" required maxlength="200" autocomplete="off" placeholder="Ex. : Appeler le client" />
      </label>

      <label>Notes
        <textarea name="notes" rows="3" maxlength="2000" placeholder="Détails (facultatif)"></textarea>
      </label>

      <fieldset class="priority">
        <legend>Priorité</legend>
        <label><input type="radio" name="priority" value="haute" /><span class="chip haute">Haute</span></label>
        <label><input type="radio" name="priority" value="moyenne" checked /><span class="chip moyenne">Moyenne</span></label>
        <label><input type="radio" name="priority" value="basse" /><span class="chip basse">Basse</span></label>
      </fieldset>

      <div class="row">
        <label>Échéance
          <input type="date" name="dueDate" />
        </label>
        <label>Catégorie
          <input name="category" list="category-options" maxlength="40" placeholder="Travail, Perso…" autocomplete="off" />
          <datalist id="category-options"></datalist>
        </label>
      </div>

      <div class="actions">
        <button type="button" class="btn danger-text" id="delete-btn" hidden>Supprimer</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" id="cancel-btn">Annuler</button>
        <button type="submit" class="btn primary" value="save">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" hidden>
    <span id="toast-text"></span>
    <button id="toast-action" class="link-btn">Annuler</button>
  </div>

  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
